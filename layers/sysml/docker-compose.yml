services:
  sysml-engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: sysml-engine
    ports:
      - "9999:9999"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true 