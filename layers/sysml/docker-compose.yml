services:
  sysml-engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: sysml-engine
    ports:
      - "9999:9999"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
  sysml-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sysml-api
    ports:
      - "10030:10030"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-network:
    name: app-network
    external: true 